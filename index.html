<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Угадай флаг</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1e2b;--mut:#6b7186;--bd:#dfe2ec;--ac:#4f46e5;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#eceef6;--mut:#9097ad;--bd:#2c3040;--ac:#818cf8;--ok:#22c55e;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#eceef6;--mut:#9097ad;--bd:#2c3040;--ac:#818cf8;--ok:#22c55e;--bad:#f87171}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;text-align:center}
h1{margin:0 0 8px;font-size:1.6rem}
p{color:var(--mut);margin:6px 0}
.big{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;margin-top:14px}
.hud{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:6px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
.flag{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:7.5rem;line-height:1.2;padding:8px 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{padding:16px 8px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font:inherit;font-weight:600;cursor:pointer;min-height:64px}
.opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.res .n{font-size:2.6rem;font-weight:800;margin:6px 0}
.res.win .n{color:var(--ok)}.res.lose .n{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.grid div{background:var(--bg);border-radius:10px;padding:8px}
.grid b{display:block;font-size:1.15rem}
h2{font-size:1.1rem;margin:20px 0 8px;text-align:left}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;padding:10px 12px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
summary small{display:block;color:var(--mut);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:.82rem;padding:3px 8px;border-radius:20px;border:1px solid var(--bd)}
.chips .y{border-color:var(--ok)}.chips .x{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.chips em{font-style:normal;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.empty{color:var(--mut);text-align:left}
.cnt{margin-top:14px;text-align:left}.cnt label{display:block;font-weight:600;margin-bottom:6px}.cnt input{width:100%;accent-color:var(--ac)}
.pre{display:flex;gap:6px;margin-top:8px}.pre button{flex:1;padding:7px 0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes flagin{from{opacity:0;transform:translateX(26px) scale(.9)}to{opacity:1;transform:none}}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.flag.a{animation:flagin .16s ease-out}.opts button{animation:pop .15s ease-out both}.opts button:nth-child(2){animation-delay:.015s}.opts button:nth-child(3){animation-delay:.03s}.opts button:nth-child(4){animation-delay:.045s}#play.flash{animation:flash .3s}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sum div{border-radius:14px;padding:12px;color:#fff;text-align:left}.sum b{display:block;font-size:1.45rem;margin:2px 0}.sum small{opacity:.85;font-size:.78rem}
.s1{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.s2{background:linear-gradient(135deg,#f59e0b,#ef4444)}.s3{background:linear-gradient(135deg,#10b981,#06b6d4)}.s4{background:linear-gradient(135deg,#ec4899,#f43f5e)}
.sec{display:flex;align-items:center;gap:8px;margin:24px 0 10px;font-size:1.1rem;font-weight:800}.sec i{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.gm{border-left:5px solid var(--ok);padding:0;overflow:hidden}.gm.lose{border-left-color:var(--bad)}.gm.t1{border-left-color:#f59e0b;background:color-mix(in srgb,#f59e0b 12%,var(--card))}.gm.t2{border-left-color:#94a3b8}.gm.t3{border-left-color:#c2410c}
.gm summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px}.gm summary::-webkit-details-marker{display:none}
.rk{font-size:1.2rem;min-width:34px;text-align:center;font-weight:800;color:var(--mut)}.md{font-style:normal;font-size:1.6rem;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.mn{flex:1;min-width:0}.pt{font-size:1.3rem;font-weight:800}.pt span{font-size:.8rem;color:var(--mut);font-weight:600}
.bg{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;background:var(--ok);margin-left:8px;vertical-align:middle}.lose .bg{background:var(--bad)}
.mt{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mut);font-size:.82rem;margin-top:2px}
.acc{height:6px;border-radius:3px;background:color-mix(in srgb,var(--bad) 35%,var(--bd));margin-top:8px;overflow:hidden}.acc i{display:block;height:100%;background:var(--ok)}
.ch{color:var(--mut);font-size:1.4rem;transition:transform .15s}details[open] .ch{transform:rotate(90deg)}
.er{padding:0 12px 8px;color:var(--bad);font-size:.85rem;font-weight:600}.er .md{font-size:1.1rem}
.gm .chips{padding:0 12px 12px;margin:0}.chips .y{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.hide{display:none}
</style>
</head>
<body>
<main>
<nav><button id="tg" class="on">Игра</button><button id="ts">Статистика</button></nav>

<section id="game">
  <div id="start" class="card">
    <h1>Угадай флаг</h1>
    <p>4 варианта на выбор. Одна ошибка — и игра окончена.</p>
    <p>Чем быстрее ответ, тем больше баллов: до 200 за раунд.</p>
    <div class="cnt"><label for="n">Количество флагов: <b id="nv">20</b></label><input type="range" id="n" min="10" max="200" value="20"><div class="pre" id="pre"></div></div><button class="big" id="go">Начать</button>
  </div>
  <div id="play" class="card hide">
    <div class="hud"><span id="rd">1/20</span><span id="sc">0 баллов</span><span id="tm">0.0 с</span></div>
    <div class="bar"><i id="pb"></i></div>
    <div class="flag" id="fl"></div>
    <div class="opts" id="op"></div>
  </div>
  <div id="end" class="card res hide">
    <h1 id="et"></h1>
    <div class="n" id="es"></div>
    <div class="grid"><div><b id="ec"></b>верно</div><div><b id="etm"></b>время</div><div><b id="er"></b>место в топе</div></div>
    <button class="big" id="again">Играть снова</button>
  </div>
</section>

<section id="stats" class="hide">
  <div class="sum" id="sum"></div><div class="sec"><i style="background:#e0e7ff">🕒</i>Последние 10 игр</div><div id="hist"></div>
  <div class="sec"><i style="background:#fef3c7">🏆</i>Топ 10 рекордов</div><div id="top"></div>
</section>
</main>

<script>
const D="RU:Россия,US:США,GB:Великобритания,FR:Франция,DE:Германия,IT:Италия,ES:Испания,PT:Португалия,NL:Нидерланды,BE:Бельгия,CH:Швейцария,AT:Австрия,SE:Швеция,NO:Норвегия,FI:Финляндия,DK:Дания,IS:Исландия,IE:Ирландия,PL:Польша,CZ:Чехия,SK:Словакия,HU:Венгрия,RO:Румыния,BG:Болгария,GR:Греция,TR:Турция,UA:Украина,BY:Беларусь,LT:Литва,LV:Латвия,EE:Эстония,MD:Молдова,RS:Сербия,HR:Хорватия,SI:Словения,BA:Босния и Герцеговина,ME:Черногория,MK:Северная Македония,AL:Албания,GE:Грузия,AM:Армения,AZ:Азербайджан,KZ:Казахстан,UZ:Узбекистан,KG:Киргизия,TJ:Таджикистан,TM:Туркменистан,CN:Китай,JP:Япония,KR:Южная Корея,KP:Северная Корея,MN:Монголия,IN:Индия,PK:Пакистан,BD:Бангладеш,TH:Таиланд,VN:Вьетнам,ID:Индонезия,MY:Малайзия,SG:Сингапур,PH:Филиппины,IR:Иран,IQ:Ирак,SA:Саудовская Аравия,AE:ОАЭ,IL:Израиль,EG:Египет,ZA:ЮАР,NG:Нигерия,KE:Кения,ET:Эфиопия,MA:Марокко,DZ:Алжир,TN:Тунис,CA:Канада,MX:Мексика,BR:Бразилия,AR:Аргентина,CL:Чили,CO:Колумбия,PE:Перу,VE:Венесуэла,CU:Куба,AU:Австралия,NZ:Новая Зеландия,CY:Кипр,LU:Люксембург,MT:Мальта,NP:Непал,LK:Шри-Ланка,AF:Афганистан,QA:Катар,JO:Иордания,LB:Ливан,GH:Гана,SN:Сенегал,UY:Уругвай,EC:Эквадор,BO:Боливия,PY:Парагвай,JM:Ямайка,AD:Андорра,MC:Монако,LI:Лихтенштейн,SM:Сан-Марино,VA:Ватикан,XK:Косово,SY:Сирия,YE:Йемен,OM:Оман,KW:Кувейт,BH:Бахрейн,MM:Мьянма,KH:Камбоджа,LA:Лаос,BN:Бруней,TL:Восточный Тимор,BT:Бутан,MV:Мальдивы,TW:Тайвань,PS:Палестина,LY:Ливия,SD:Судан,SS:Южный Судан,SO:Сомали,DJ:Джибути,ER:Эритрея,UG:Уганда,TZ:Танзания,RW:Руанда,BI:Бурунди,CD:ДР Конго,CG:Республика Конго,GA:Габон,GQ:Экваториальная Гвинея,CM:Камерун,CF:ЦАР,TD:Чад,NE:Нигер,ML:Мали,BF:Буркина-Фасо,MR:Мавритания,GM:Гамбия,GW:Гвинея-Бисау,GN:Гвинея,SL:Сьерра-Леоне,LR:Либерия,CI:Кот-д’Ивуар,TG:Того,BJ:Бенин,AO:Ангола,ZM:Замбия,ZW:Зимбабве,MW:Малави,MZ:Мозамбик,MG:Мадагаскар,MU:Маврикий,SC:Сейшелы,KM:Коморы,CV:Кабо-Верде,ST:Сан-Томе и Принсипи,NA:Намибия,BW:Ботсвана,SZ:Эсватини,LS:Лесото,GT:Гватемала,BZ:Белиз,SV:Сальвадор,HN:Гондурас,NI:Никарагуа,CR:Коста-Рика,PA:Панама,DO:Доминиканская Республика,HT:Гаити,BS:Багамы,BB:Барбадос,TT:Тринидад и Тобаго,GY:Гайана,SR:Суринам,AG:Антигуа и Барбуда,DM:Доминика,GD:Гренада,KN:Сент-Китс и Невис,LC:Сент-Люсия,VC:Сент-Винсент и Гренадины,PG:Папуа — Новая Гвинея,FJ:Фиджи,WS:Самоа,TO:Тонга,VU:Вануату,SB:Соломоновы Острова,KI:Кирибати,TV:Тувалу,NR:Науру,FM:Микронезия,MH:Маршалловы Острова,PW:Палау".split(",").map(s=>{const[c,n]=s.split(":");return{c,n}});
const NAME=Object.fromEntries(D.map(x=>[x.c,x.n]));
const emoji=c=>String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0)));
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const mem={};
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return mem[k]||[]}};
const save=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

let TOTAL=20;
let q,i,correct,score,t0,r0,timer,lock,log;

const show=id=>{["start","play","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))};
const fmt=ms=>(ms/1000).toFixed(2)+" с";

function startGame(){
  TOTAL=+$("n").value;q=shuffle(D).slice(0,TOTAL);i=0;correct=0;score=0;log=[];
  t0=performance.now();
  clearInterval(timer);
  timer=setInterval(()=>{$("tm").textContent=((performance.now()-t0)/1000).toFixed(1)+" с"},100);
  show("play");round();
}

function round(){
  lock=false;
  const cur=q[i];
  const opts=shuffle([cur,...shuffle(D.filter(x=>x!==cur)).slice(0,3)]);
  $("rd").textContent=(i+1)+"/"+TOTAL;
  $("sc").textContent=score+" баллов";
  $("pb").style.width=(i/TOTAL*100)+"%";
  const f=$("fl");f.textContent=emoji(cur.c);f.classList.remove("a");void f.offsetWidth;f.classList.add("a");
  $("op").innerHTML="";
  opts.forEach((o,k)=>{
    const b=document.createElement("button");
    b.textContent=o.n;b.dataset.c=o.c;
    b.onclick=()=>answer(b,o.c);
    $("op").appendChild(b);
  });
  r0=performance.now();
}

function answer(btn,c){
  if(lock)return;lock=true;
  const cur=q[i],dt=performance.now()-r0;
  if(c===cur.c){
    btn.classList.add("ok");
    correct++;
    score+=100+Math.max(0,100-Math.round(dt/50));
    log.push([cur.c,1]);
    $("sc").textContent=score+" баллов";
    i++;
    const p=$("play");p.classList.remove("flash");void p.offsetWidth;p.classList.add("flash");
    if(i>=TOTAL)finish(true);else round();
  }else{
    btn.classList.add("bad");
    [...$("op").children].forEach(b=>{if(b.dataset.c===cur.c)b.classList.add("ok")});
    log.push([cur.c,0]);
    setTimeout(()=>finish(false),700);
  }
}

function finish(win){
  clearInterval(timer);
  const ms=performance.now()-t0;
  const rec={t:Date.now(),n:TOTAL,s:score,c:correct,ms:Math.round(ms),win,list:log};
  const hist=[rec,...load("flag_hist")].slice(0,10);
  save("flag_hist",hist);
  const top=[...load("flag_top"),rec].sort((a,b)=>b.s-a.s||a.ms-b.ms).slice(0,10);
  save("flag_top",top);
  const place=top.findIndex(r=>r===rec||(r.t===rec.t&&r.s===rec.s));
  $("end").className="card res "+(win?"win":"lose");
  $("et").textContent=win?"Победа!":"Игра окончена";
  $("es").textContent=score+" баллов";
  $("ec").textContent=correct+"/"+TOTAL;
  $("etm").textContent=fmt(ms);
  $("er").textContent=place>=0?"№"+(place+1):"—";
  show("end");
}

function dt(t){return new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}

function render(list,box,rank){
  if(!list.length){box.innerHTML='<p class="empty">Пока нет сыгранных игр.</p>';return}
  box.innerHTML=list.map((r,n)=>{
    const chips=r.list.map(([c,ok])=>'<span class="'+(ok?"y":"x")+'"><em>'+emoji(c)+"</em> "+NAME[c]+"</span>").join("");
    const nn=r.n||20,pc=Math.round(r.c/nn*100),bad=r.list.filter(x=>!x[1]).map(x=>'<em class="md">'+emoji(x[0])+"</em> "+NAME[x[0]]),rk=rank?(n<3?'<span class="rk"><em class="md">'+["🥇","🥈","🥉"][n]+"</em></span>":'<span class="rk">'+(n+1)+"</span>"):"";
    return '<details class="gm'+(r.win?"":" lose")+(rank&&n<3?" t"+(n+1):"")+'"><summary>'+rk+'<div class="mn"><div class="pt">'+r.s.toLocaleString("ru-RU")+' <span>баллов</span><b class="bg">'+(r.win?"Победа":"Поражение")+"</b></div>"
      +'<div class="mt"><span>🎯 '+r.c+"/"+nn+"</span><span>⏱ "+fmt(r.ms)+"</span><span>🕒 "+dt(r.t)+'</span></div><div class="acc"><i style="width:'+pc+'%"></i></div></div><span class="ch">›</span></summary>'
     +(bad.length?'<div class="er">Ошибка: '+bad.join(", ")+"</div>":"")
      +'<div class="chips">'+chips+"</div></details>";
  }).join("");
}

function showStats(){
  render(load("flag_hist"),$("hist"),false);
  render(load("flag_top"),$("top"),true);
  const h=load("flag_hist"),t=load("flag_top"),w=h.filter(r=>r.win),bt=w.length?Math.min(...w.map(r=>r.ms)):0,tot=h.reduce((a,r)=>a+(r.n||20),0);
  $("sum").innerHTML=h.length?[["s1","Лучший счёт",t[0]?t[0].s.toLocaleString("ru-RU"):"—","рекорд"],["s2","Лучшее время победы",bt?fmt(bt):"—","среди последних игр"],["s3","Побед",w.length+" из "+h.length,"последние игры"],["s4","Точность",Math.round(h.reduce((a,r)=>a+r.c,0)/tot*100)+"%","верных ответов"]].map(a=>'<div class="'+a[0]+'"><small>'+a[1]+"</small><b>"+a[2]+"</b><small>"+a[3]+"</small></div>").join(""):"";
}

function tab(stat){
  $("game").classList.toggle("hide",stat);
  $("stats").classList.toggle("hide",!stat);
  $("tg").classList.toggle("on",!stat);
  $("ts").classList.toggle("on",stat);
  if(stat)showStats();
}

$("tg").onclick=()=>tab(false);
$("ts").onclick=()=>tab(true);
const N=$("n");N.max=D.length;
const setN=v=>{N.value=v;$("nv").textContent=v};
N.oninput=()=>setN(N.value);
[10,20,50,100,D.length].forEach(v=>{const b=document.createElement("button");b.textContent=v===D.length?"Все ("+v+")":v;b.onclick=()=>setN(v);$("pre").appendChild(b)});
$("go").onclick=startGame;
$("again").onclick=startGame;
document.addEventListener("keydown",e=>{
  if(e.key>="1"&&e.key<="4"&&!$("play").classList.contains("hide")){
    const b=$("op").children[+e.key-1];if(b)b.click();
  }
});
</script>
</body>
</html>
